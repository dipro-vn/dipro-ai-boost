<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white)} .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  function Row(p) { return h('div', { className: 'row' }, p.children); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(Row, null, h(D.Button, null, '申請する'), h(D.Button, { variant: 'outlined' }, '下書き保存'), h(D.Button, { variant: 'text' }, 'キャンセル'), h(D.Button, { disabled: true }, '送信')),
    h(Row, null, h(D.Button, { size: 'md' }, 'Medium'), h(D.Button, { size: 'sm', variant: 'outlined' }, 'Small'), h(D.Button, { size: 'xs', variant: 'text' }, 'X-Small')),
    h(Row, null, h(D.Button, { leadIcon: 'download_300' }, 'ダウンロード'), h(D.Button, { variant: 'outlined', tailIcon: 'new_window_300', href: '#' }, '外部サイト'))
  ));
</script>
</body>
</html>
