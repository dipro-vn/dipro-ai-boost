<!-- @dsCard group="Forms" height=408 -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white);color:var(--solid-gray-900)} .grid{display:grid;grid-template-columns:repeat(2,327px);gap:24px 40px} .row{display:flex;gap:8px;align-items:center} .unit{font-size:16px;line-height:1;color:var(--solid-gray-900)} .full{grid-column:1/-1} .fs{border:0;margin:0;padding:0} .lg{padding:0;margin-bottom:8px;font-size:17px;font-weight:700;line-height:1.7;letter-spacing:0.02em;color:var(--solid-gray-800)}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  var prefs = ['北海道', '青森県', '岩手県', '宮城県', '東京都', '神奈川県', '大阪府', '福岡県', '沖縄県', 'その他'];
  function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i < 10 ? '0' + i : String(i)); return r; }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
    h(D.Select, { label: '都道府県', required: true, supportText: '海外の場合は「その他」をお選びください。', options: prefs }),
    h(D.Select, { label: '都道府県', required: true, options: prefs, errorText: '＊都道府県を選択してください。' }),
    h(D.Select, { size: 'md', label: '連絡方法', optional: true, options: ['メール', '電話', '郵送'], defaultValue: 'メール' }),
    h(D.Select, { size: 'sm', label: '受取窓口', disabled: true, options: ['本庁舎'], defaultValue: '本庁舎' }),
    h('fieldset', { className: 'full fs' },
      h('legend', { className: 'lg' }, '有効期限'),
      h('div', { className: 'row' },
        h(D.Select, { size: 'md', 'aria-label': '年', placeholder: null, options: range(2025, 2035), defaultValue: '2026', selectWidth: 100 }),
        h('span', { className: 'unit' }, '年'),
        h(D.Select, { size: 'md', 'aria-label': '月', placeholder: null, options: range(1, 12), defaultValue: '06', selectWidth: 78 }),
        h('span', { className: 'unit' }, '月'),
        h(D.Select, { size: 'md', 'aria-label': '日', placeholder: null, options: range(1, 31), defaultValue: '30', selectWidth: 78 }),
        h('span', { className: 'unit' }, '日')))
  ));
</script>
</body>
</html>
