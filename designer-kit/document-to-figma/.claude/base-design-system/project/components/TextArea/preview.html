<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white);color:var(--solid-gray-900)} .grid{display:grid;grid-template-columns:repeat(2,327px);gap:24px 40px}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  var over = 'ご案内いただいた手続きの流れが分かりにくく、どの書類を先に提出すればよいのか迷いました。オンライン申請の画面にも、必要書類の一覧と提出の順番を記載していただけると助かります。また、入力途中で保存できる機能があると便利です。';
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
    h(D.TextArea, { label: 'ご意見・ご要望', required: true, supportText: '100文字以内', maxCount: 100 }),
    h(D.TextArea, { label: 'ご意見・ご要望', required: true, supportText: '100文字以内', maxCount: 100, defaultValue: over, errorText: '＊100文字以内で入力してください。' }),
    h(D.TextArea, { size: 'sm', label: '備考', optional: true, readOnly: true, maxCount: 100, defaultValue: '窓口での受け取りを希望' }),
    h(D.TextArea, { size: 'sm', label: '備考', disabled: true, maxCount: 100, defaultValue: '入力不要' })
  ));
</script>
</body>
</html>
