<!-- @dsCard group="Foundations" height=312 -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8">
<style>
  body { margin:0; padding:16px; background:var(--white); font-family:var(--font-sans); color:var(--solid-gray-800); }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  .sw { height:96px; border-radius:var(--radius-8); border:1px solid var(--opacity-gray-100); display:flex; align-items:flex-end; padding:8px 12px; box-sizing:border-box; }
  .sw b { font-size:20px; font-weight:700; letter-spacing:0.02em; color:var(--white); }
  .sw b.ink { color:var(--solid-gray-800); }
  .name { margin:8px 0 0; font:400 14px/1.3 var(--font-mono); color:var(--solid-gray-800); }
  .photo { position:relative; background:var(--gradient-placeholder); }
  .photo::after { content:""; position:absolute; inset:0; border-radius:inherit; background:var(--gradient-scrim); }
  .photo b { position:relative; z-index:1; }
</style></head>
<body>
<div class="grid">
  <div><div class="sw" style="background:var(--gradient-key)"><b>申請受付中</b></div><p class="name">gradient-key</p></div>
  <div><div class="sw" style="background:var(--gradient-crimson)"><b>ポイント10倍</b></div><p class="name">gradient-crimson</p></div>
  <div><div class="sw" style="background:var(--gradient-key-tint)"><b class="ink">お知らせ</b></div><p class="name">gradient-key-tint</p></div>
  <div><div class="sw" style="background:var(--gradient-crimson-tint)"><b class="ink">セール特集</b></div><p class="name">gradient-crimson-tint</p></div>
  <div><div class="sw" style="background:var(--gradient-campaign)"><b>本日限定</b></div><p class="name">gradient-campaign</p></div>
  <div><div class="sw" style="background:var(--gradient-placeholder)"></div><p class="name">gradient-placeholder</p></div>
  <div><div class="sw photo"><b>写真キャプション</b></div><p class="name">gradient-scrim (over a photo)</p></div>
</div>
</body>
</html>
