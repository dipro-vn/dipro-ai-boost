[package]
name = "orchestrator-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orchestrator_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
thiserror = "2.0.20"
tempfile = "3.27.0"
dunce = "1.0.5"
chrono = { version = "0.4.45", features = ["serde"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
regex = "1"
sha2 = "0.10"
# Phase E (AC-E1-19) — Backlog API key lives in the OS keychain, never in a
# file. `apple-native`/`windows-native`/`sync-secret-service` are the
# platform backends; no fallback-to-file backend is enabled on purpose.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
include_dir = "0.7.4"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

