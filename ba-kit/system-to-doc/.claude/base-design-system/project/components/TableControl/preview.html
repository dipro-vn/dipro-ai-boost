<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white)} .block{margin-bottom:32px}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  function Demo() {
    var s = React.useState('パスポート'), per = React.useState(50);
    return h(React.Fragment, null,
      h('div', { className: 'block' }, h(D.TableControl, null,
        h(D.TableControlSearch, { value: s[0], onChange: s[1], count: s[0] ? '25 件' : '1200 件', onReset: function () { s[1](''); } }),
        h(D.TableControlGroup, null,
          h(D.Button, { variant: 'outlined', size: 'xs', leadIcon: 'print_false' }, '印刷'),
          h(D.Button, { variant: 'outlined', size: 'xs' }, 'CSVダウンロード'),
          h(D.TableControlDivider, null),
          h(D.Button, { variant: 'outlined', size: 'xs', leadIcon: 'add_300' }, '新規追加')))),
      h(D.TableControl, null,
        h('span', null, '1 / 120 ページ'),
        h(D.TableControlItemsPerPage, { value: per[0], onChange: per[1] })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
