<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white)} .row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  function ph(a, b) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="hsl(' + a + ',60%,90%)"/>' +
      '<circle cx="300" cy="80" r="40" fill="hsl(' + b + ',80%,70%)"/><path d="M0 300 L130 140 L220 240 L290 180 L400 300Z" fill="hsl(' + a + ',45%,55%)"/></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' },
    h(D.ImageSingle, { src: ph(330, 45), alt: '満開のつつじが咲く公園の遊歩道', caption: '写真提供：デジタル区地域課', captionStyle: 'solid' }),
    h(D.ImageSingle, { src: ph(140, 40), alt: 'デジタルつつじ公園の全景', variant: 'borderless', caption: 'これはダミーの画像キャプションです。デザインやレイアウトの確認に使用します。' }),
    h(D.ImageSingle, { src: ph(210, 30), alt: 'つつじ花見ツアーの詳細を見る', href: '#', caption: 'リンク付きの画像（ホバーで枠線が太くなります）' })
  ));
</script>
</body>
</html>
