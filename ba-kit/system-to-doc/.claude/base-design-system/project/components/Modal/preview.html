<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white)} .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  function noop() {}
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' }, h('div', { className: 'col' },
    h(D.Modal, { open: true, inline: true, onClose: noop, title: '申請内容の送信',
      startAction: h(D.Button, { variant: 'text' }, 'キャンセル'),
      actions: [h(D.Button, { key: 'o', variant: 'outlined' }, '下書き保存'), h(D.Button, { key: 's' }, '送信する')] },
      '入力した内容で申請を送信します。送信後は内容を変更できません。'),
    h(D.Modal, { open: true, inline: true, onClose: noop, showCloseButton: false, titleIcon: 'warning_300-true',
      title: 'お手続きが必要です', actions: h(D.Button, null, 'OK') },
      'マイページよりお知らせの内容を確認し、期限までにご対応をお願いいたします。')),
    h(D.Modal, { open: true, inline: true, type: 'mobile', onClose: noop, title: '確認',
      startAction: h(D.Button, { variant: 'text' }, 'キャンセル'),
      actions: [h(D.Button, { key: 'o', variant: 'outlined' }, '下書き保存'), h(D.Button, { key: 's' }, '送信する')] },
      '入力した内容で申請を送信します。')
  ));
</script>
</body>
</html>
