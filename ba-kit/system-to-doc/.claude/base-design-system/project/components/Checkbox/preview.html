<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white);color:var(--solid-gray-800)} .row{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  function Row(p) { return h("div", { className: "row" }, p.children); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(Row, null,
      h(D.CheckboxGroup, { label: '受け取り方法', requirement: 'required', supportText: '複数選択できます', size: 'md' },
        h(D.Checkbox, { defaultChecked: true }, '郵送'), h(D.Checkbox, null, 'メール'), h(D.Checkbox, { disabled: true }, '窓口（休止中）')),
      h(D.CheckboxGroup, { label: '利用する手続き', layout: 'inline', error: '＊1つ以上選択してください。' },
        h(D.Checkbox, null, '住民票'), h(D.Checkbox, null, '印鑑証明'), h(D.Checkbox, null, '戸籍謄本'))),
    h(Row, null,
      h(D.Checkbox, { indeterminate: true }, 'すべて選択'), h(D.Checkbox, { defaultChecked: true, disabled: true }, '同意済み'),
      h(D.Checkbox, { size: 'md', defaultChecked: true }, 'Medium'), h(D.Checkbox, { size: 'lg', defaultChecked: true }, 'Large'), h(D.Checkbox, { size: 'lg', indeterminate: true, error: true }, 'エラー'))
  ));
</script>
</body>
</html>
