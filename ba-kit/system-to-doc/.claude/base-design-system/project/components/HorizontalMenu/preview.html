<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white);color:var(--solid-gray-900)} .block{margin-bottom:32px} .panel{background:var(--white);border:1px solid var(--black);box-shadow:var(--elevation-3);padding:16px 24px;font-size:16px;line-height:1.7}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  var panel = h('div', { className: 'panel' }, '防災・救急に関するページの一覧がここに表示されます。');
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'block' }, h(D.HorizontalMenu, { items: [
      { label: 'ホーム', href: '#', current: true },
      { label: '防災・救急', panel: panel },
      { label: 'くらし・手続き', panel: panel },
      { label: '子育て・教育', panel: panel },
      { label: '産業・ビジネス', href: '#' }
    ] })),
    h('div', { className: 'block' }, h(D.HorizontalMenu, { 'aria-label': '事業者向けメニュー', defaultExpandedIndex: 1, items: [
      { label: 'お知らせ', href: '#', icon: 'notification_false' },
      { label: '申請・届出', icon: 'document_false', panel: panel },
      { label: 'よくある質問', href: '#', icon: 'help_false' }
    ] }))
  ));
</script>
</body>
</html>
