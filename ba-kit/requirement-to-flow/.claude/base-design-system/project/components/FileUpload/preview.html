<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white);color:var(--solid-gray-900)} .stack{display:flex;flex-direction:column;gap:40px}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  function check(f) { return /\.(jpe?g|png|pdf)$/i.test(f.name) ? null : ['＊JPEG、PNG、PDF以外のファイルは登録できません。']; }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'stack' },
    h(D.FileUpload, { label: '居所を証明する書類', supportText: '以下のいずれか1つ。JPEG、PNG、PDFのみ。', multiple: true, showSummary: true, validate: check,
      defaultFiles: [{ name: '賃貸借契約書.pdf', size: 1843200 }, { name: '公共料金の請求書.docx', size: 52310 }] }),
    h(D.FileUpload, { type: 'button', label: '本人確認書類', error: '＊ファイルを選択してください。' })
  ));
</script>
</body>
</html>
