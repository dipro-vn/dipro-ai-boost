<!-- @dsCard group="Overlays" height=560 -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>
body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white);color:var(--solid-gray-900)}
.page{min-height:528px;box-sizing:border-box;border:1px solid var(--solid-gray-420);border-radius:var(--radius-8)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:68px;padding:0 16px;border-bottom:1px solid var(--solid-gray-420)}
.top b{font-size:16px} .main{padding:24px 16px;font-size:16px;line-height:1.7} .row{display:flex;gap:12px;flex-wrap:wrap}
</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement, I = D.MobileMenuItem;
  function App() {
    var s = React.useState('right'), side = s[0];
    var o = React.useState(true), open = o[0];
    function show(v) { s[1](v); o[1](true); }
    return h('div', { className: 'page' },
      h('div', { className: 'top' }, h('b', null, '〇〇市'), h(D.HamburgerMenuButton, { 'aria-expanded': open, 'aria-controls': 'site-drawer', onClick: function () { show('right'); } })),
      h('div', { className: 'main' }, h('p', null, 'ドロワーはモーダルで表示され、Escキーや背景のクリックで閉じます。'),
        h('div', { className: 'row' }, h(D.Button, { size: 'sm', variant: 'outlined', onClick: function () { show('right'); } }, '右から開く'), h(D.Button, { size: 'sm', variant: 'outlined', onClick: function () { show('left'); } }, '左から開く'), h(D.Button, { size: 'sm', variant: 'outlined', onClick: function () { show('full'); } }, '全面で開く'))),
      h(D.Drawer, { id: 'site-drawer', open: open, side: side, onOpenChange: o[1] },
        h(D.MobileMenu, null,
          h(D.MobileMenuSection, { title: 'メニュー' },
            h(I, { href: '#', current: true }, 'ホーム'),
            h(I, { href: '#' }, '防災・救急'),
            h(I, { href: '#' }, 'くらし・手続き'),
            h(I, { href: '#' }, '子育て・教育'),
            h(I, { href: '#' }, '健康・医療・福祉'),
            h(I, { href: '#' }, '観光・イベント')))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
