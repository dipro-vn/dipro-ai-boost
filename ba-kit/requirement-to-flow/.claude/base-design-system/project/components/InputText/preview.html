<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--white);color:var(--solid-gray-900)} .grid{display:grid;grid-template-columns:repeat(2,327px);gap:24px 40px} .row{display:flex;gap:8px;align-items:flex-end;grid-column:1/-1} .dash{font-size:16px;line-height:1;color:var(--solid-gray-800);padding-bottom:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var D = window.DADS, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
    h(D.InputText, { label: '氏名', required: true, supportText: '例：デジタル 太郎', defaultValue: '' }),
    h(D.InputText, { label: 'メールアドレス', required: true, type: 'email', defaultValue: 'taro@example', errorText: '＊正しいメールアドレスを入力してください。' }),
    h(D.InputText, { size: 'md', label: '電話番号', optional: true, supportText: '半角数字、ハイフンなし', inputMode: 'numeric', defaultValue: '0312345678' }),
    h(D.InputText, { size: 'md', label: '申請番号', readOnly: true, defaultValue: 'A-2025-001234' }),
    h(D.InputText, { size: 'sm', label: '勤務先', defaultValue: 'デジタル庁' }),
    h(D.InputText, { size: 'sm', label: '旧姓', disabled: true, defaultValue: '入力不要' }),
    h('div', { className: 'row' },
      h(D.InputText, { size: 'md', label: '郵便番号', defaultValue: '102', inputWidth: 69, inputMode: 'numeric' }),
      h('span', { className: 'dash', 'aria-hidden': true }, '—'),
      h(D.InputText, { size: 'md', 'aria-label': '郵便番号（下4桁）', defaultValue: '0094', inputWidth: 80, inputMode: 'numeric' }))
  ));
</script>
</body>
</html>
